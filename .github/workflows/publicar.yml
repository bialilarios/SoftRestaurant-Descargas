# Cuando cambia softbackup/ en main, publica el release softbackup-v<VERSION> con SoftBackup.zip
name: Publicar SoftBackup
on:
  push:
    branches: [main]
    paths: ['softbackup/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear o actualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < softbackup/VERSION)
          TAG="softbackup-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" softbackup/SoftBackup.zip --clobber
            gh release edit "$TAG" --notes-file softbackup/NOTAS.md
          else
            gh release create "$TAG" softbackup/SoftBackup.zip --target "$GITHUB_SHA" --title "SoftBackup $V" --notes-file softbackup/NOTAS.md --latest
          fi
